<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – TalentScore</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d14;
      --card: #1a1a2e;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #f0eeff;
      --muted: #8b87a8;
      --error: #f87171;
      --success: #34d399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,247,0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 8s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(167,139,250,0.1) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(30px, 30px); }
    }

    /* Brand top-left */
    .brand {
      position: fixed;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--text);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      position: relative;
      z-index: 1;
    }

    .form-header { margin-bottom: 32px; }

    .form-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-header p { color: var(--muted); font-size: 14px; }

    .form-header a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 500;
    }

    .form-header a:hover { text-decoration: underline; }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      outline: none;
    }

    .field input::placeholder { color: rgba(139,135,168,0.45); }

    .field input:focus {
      border-color: var(--accent);
      background: rgba(124,106,247,0.06);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.12);
    }

    .field input.error-input {
      border-color: var(--error);
      background: rgba(248,113,113,0.05);
    }

    .field-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
      display: none;
    }

    .field-error.show { display: block; }

    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 46px; }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pw:hover { color: var(--text); }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .field-row label { margin-bottom: 0; }

    .field-row a {
      font-size: 13px;
      color: var(--accent2);
      text-decoration: none;
      cursor: pointer;
    }

    .field-row a:hover { text-decoration: underline; }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 20px;
    }

    .remember input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #6355e0);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.25s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(124,106,247,0.4);
    }

    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .submit-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .global-msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .global-msg.show { display: block; }
    .global-msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
    .global-msg.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--success); }

    /* ── Forgot Password Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      position: relative;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--text); }

    .modal h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    #modalMsg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    #modalMsg.show { display: block; }
    #modalMsg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
    #modalMsg.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--success); }

    @media (max-width: 500px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<div class="brand">
  <div class="brand-icon">⚡</div>
  <span class="brand-name">TalentScore</span>
</div>

<div class="card">
  <div class="form-header">
    <h1>Welcome back</h1>
    <p>Don't have an account? <a href="signup.html">Sign up free</a></p>
  </div>

  <div id="globalMsg" class="global-msg"></div>

  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
    <div class="field-error" id="emailErr">Please enter a valid email address.</div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      <button class="toggle-pw" type="button" onclick="togglePw()">👁</button>
    </div>
    <div class="field-error" id="passwordErr">Please enter your password.</div>
  </div>


  <button class="submit-btn" id="submitBtn" onclick="handleLogin()">
    <span id="btnText">Sign In</span>
    <div class="spinner" id="spinner"></div>
  </button>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotOverlay" onclick="closeForgotOnBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeForgot()">✕</button>
    <h2>Reset password</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>

    <div id="modalMsg"></div>

    <div class="field">
      <label for="resetEmail">Email address</label>
      <input type="email" id="resetEmail" placeholder="you@company.com" autocomplete="email">
      <div class="field-error" id="resetEmailErr">Please enter a valid email address.</div>
    </div>

    <button class="submit-btn" id="resetBtn" onclick="handleReset()">
      <span id="resetBtnText">Send Reset Link</span>
      <div class="spinner" id="resetSpinner"></div>
    </button>
  </div>
</div>

<script>
  function togglePw() {
    const input = document.getElementById('password');
    const btn = document.querySelector('.toggle-pw');
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
  }

  function showError(id, msgId, msg) {
    document.getElementById(id).classList.add('error-input');
    const err = document.getElementById(msgId);
    err.textContent = msg;
    err.classList.add('show');
  }

  function clearError(id, msgId) {
    document.getElementById(id).classList.remove('error-input');
    document.getElementById(msgId).classList.remove('show');
  }

  function showGlobal(msg, type) {
    const el = document.getElementById('globalMsg');
    el.textContent = msg;
    el.className = `global-msg show ${type}`;
  }

  // ── Forgot Password Modal ──
  function openForgot() {
    document.getElementById('forgotOverlay').classList.add('show');
    document.getElementById('resetEmail').focus();
  }

  function closeForgot() {
    document.getElementById('forgotOverlay').classList.remove('show');
    document.getElementById('resetEmail').value = '';
    document.getElementById('modalMsg').className = '';
    document.getElementById('modalMsg').textContent = '';
    clearError('resetEmail', 'resetEmailErr');
  }

  function closeForgotOnBg(e) {
    if (e.target === document.getElementById('forgotOverlay')) closeForgot();
  }

  async function handleReset() {
    const email = document.getElementById('resetEmail').value.trim();
    clearError('resetEmail', 'resetEmailErr');
    document.getElementById('modalMsg').className = '';

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('resetEmail', 'resetEmailErr', 'Please enter a valid email address.');
      return;
    }

    const btn = document.getElementById('resetBtn');
    document.getElementById('resetBtnText').style.display = 'none';
    document.getElementById('resetSpinner').style.display = 'block';
    btn.disabled = true;

    try {
      const res = await fetch('https://resume-parser-r9dg.onrender.com/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.detail || 'Failed to send reset email.');

      const msg = document.getElementById('modalMsg');
      msg.textContent = 'Reset link sent! Check your inbox.';
      msg.className = 'show success';
      document.getElementById('resetBtn').style.display = 'none';

    } catch (err) {
      const msg = document.getElementById('modalMsg');
      msg.textContent = err.message;
      msg.className = 'show error';
    } finally {
      document.getElementById('resetBtnText').style.display = 'block';
      document.getElementById('resetSpinner').style.display = 'none';
      btn.disabled = false;
    }
  }

  // ── Login ──
  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    clearError('email', 'emailErr');
    clearError('password', 'passwordErr');
    document.getElementById('globalMsg').classList.remove('show');

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('email', 'emailErr', 'Please enter a valid email address.');
      valid = false;
    }
    if (!password) {
      showError('password', 'passwordErr', 'Please enter your password.');
      valid = false;
    }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    document.getElementById('btnText').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';
    btn.disabled = true;

    try {
      const res = await fetch('https://resume-parser-r9dg.onrender.com/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.detail || 'Invalid email or password.');

      const storage = localStorage;
      storage.setItem('ts_access_token', data.access_token);
      storage.setItem('ts_refresh_token', data.refresh_token);
      storage.setItem('ts_user_email', email);

      showGlobal('✅ Signed in! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1400);

    } catch (err) {
      showGlobal(err.message, 'error');
    } finally {
      document.getElementById('btnText').style.display = 'block';
      document.getElementById('spinner').style.display = 'none';
      btn.disabled = false;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('ts_access_token') || sessionStorage.getItem('ts_access_token');
    if (token) window.location.href = 'index.html';
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeForgot();
    if (e.key === 'Enter') {
      if (document.getElementById('forgotOverlay').classList.contains('show')) handleReset();
      else handleLogin();
    }
  });
</script>
</body>
</html>
