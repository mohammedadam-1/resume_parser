[project]
name = "resume-parser"
version = "0.1.0"
description = "This AI resume parser, parsers and shorlists the candidates based on their profile"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.0.0",
    "datefinder>=0.7.3",
    "fastapi[standard]>=0.128.0",
    "pydantic>=2.12.5",
    "supabase>=2.28.0",
    "boto3>=1.42.51",
    "resend>=2.23.0",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "pyjwt>=2.11.0",
    "pwdlib>=0.3.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.1",
    "python-dotenv>=1.2.1",
    "pdfplumber>=0.11.9",
]
